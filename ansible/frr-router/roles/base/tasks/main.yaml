---
- name: Update apt cache and apply full upgrade
  ansible.builtin.apt:
    update_cache: true
    upgrade: full

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
    state: present

- name: Enable periodic unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Enable IPv4 forwarding
  ansible.builtin.template:
    src: 99-frr-router.conf.j2
    dest: /etc/sysctl.d/99-frr-router.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sysctl

- name: Query current IPv4 settings of the NM connection
  ansible.builtin.command: >-
    nmcli -g ipv4.method,ipv4.addresses,ipv4.gateway,ipv4.dns
    con show "{{ frr_nm_connection }}"
  register: frr_nm_ipv4_state
  changed_when: false

- name: Set static IPv4 configuration on the NM connection
  ansible.builtin.command: >-
    nmcli con mod "{{ frr_nm_connection }}"
    ipv4.method manual
    ipv4.addresses {{ frr_lan_ip }}/{{ frr_lan_prefix }}
    ipv4.gateway {{ frr_lan_gateway }}
    ipv4.dns {{ frr_lan_dns }}
  when: frr_nm_ipv4_state.stdout_lines != frr_nm_desired_ipv4_state
  register: frr_nm_ipv4_mod

- name: Reapply the NM device configuration
  ansible.builtin.command: nmcli device reapply {{ frr_lan_interface }}
  when: frr_nm_ipv4_mod is changed

- name: Query wifi autoconnect state before the eth0 switch
  ansible.builtin.command: nmcli -g connection.autoconnect con show preconfigured
  register: frr_nm_wifi_autoconnect
  changed_when: false
  when: frr_lan_interface == "eth0"

- name: Disable wifi autoconnect once eth0 is the LAN interface
  ansible.builtin.command: nmcli con mod preconfigured connection.autoconnect no
  when:
    - frr_lan_interface == "eth0"
    - frr_nm_wifi_autoconnect.stdout | trim != "no"

- name: Check whether a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: frr_reboot_required

- name: Reboot to finish pending upgrades
  ansible.builtin.reboot:
    reboot_timeout: 600
  when: frr_reboot_required.stat.exists
