---
- name: Install FRR packages
  ansible.builtin.apt:
    name:
      - frr
      - frr-pythontools
    state: present

- name: Enable the bgpd daemon
  ansible.builtin.lineinfile:
    path: /etc/frr/daemons
    regexp: '^bgpd='
    line: bgpd=yes
  notify: Restart frr

- name: Deploy the FRR configuration
  ansible.builtin.template:
    src: frr.conf.j2
    dest: /etc/frr/frr.conf
    owner: frr
    group: frr
    mode: "0640"
  notify: Restart frr

- name: Enable and start the frr service
  ansible.builtin.systemd:
    name: frr
    enabled: true
    state: started
