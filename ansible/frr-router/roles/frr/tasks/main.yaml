---
- name: Install the FRRouting apt signing key
  ansible.builtin.get_url:
    url: "{{ frr_apt_key_url }}"
    dest: "{{ frr_apt_keyring }}"
    mode: "0644"

- name: Write the FRRouting apt source
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/frrouting.list
    mode: "0644"
    content: "deb [signed-by={{ frr_apt_keyring }}] https://deb.frrouting.org/frr {{ ansible_distribution_release }} {{ frr_apt_channel }}\n"
  register: frr_apt_source

- name: Refresh the apt cache
  ansible.builtin.apt:
    update_cache: true
  when: frr_apt_source.changed

- name: Pin frr to the FRRouting repository
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/frrouting
    mode: "0644"
    content: |
      Package: frr frr-*
      Pin: origin deb.frrouting.org
      Pin-Priority: 1001

- name: Install FRR packages
  ansible.builtin.apt:
    name:
      - "frr={{ frr_package_version }}"
      - "frr-pythontools={{ frr_package_version }}"
    state: present
    allow_change_held_packages: true
  notify: Restart frr

- name: Enable the bgpd daemon
  ansible.builtin.lineinfile:
    path: /etc/frr/daemons
    regexp: '^bgpd='
    line: bgpd=yes
  notify: Restart frr

- name: Deploy the FRR configuration
  ansible.builtin.template:
    src: frr.conf.j2
    dest: /etc/frr/frr.conf
    owner: frr
    group: frr
    mode: "0640"
  notify: Restart frr

- name: Enable and start the frr service
  ansible.builtin.systemd:
    name: frr
    enabled: true
    state: started
