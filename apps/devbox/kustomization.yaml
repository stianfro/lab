apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - storageclass.yaml
  - storageclass-local.yaml
  - namespace.yaml
  - vm.yaml
  # service.yaml is intentionally not deployed: the primary devbox on the
  # external libvirt host owns 192.168.1.51. Re-add it only when the standby
  # VM must serve traffic (see README.md).
  - node-exporter-service.yaml
  - servicemonitor.yaml
configMapGenerator:
  - name: devbox-grafana-dashboards
    namespace: devbox
    files:
      - dashboards/agent-usage.json
    options:
      labels:
        grafana_dashboard: "1"
