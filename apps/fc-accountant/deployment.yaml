apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: fc-accountant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fc-accountant
  template:
    metadata:
      labels:
        app: fc-accountant
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal
          image: registry.talos.froystein.jp/fc-accountant@sha256:c1b6b2b67fc1d226061de51bb36513e91d40784593cc546204fb2b831b1dae7b
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          volumeMounts:
            - name: documents
              mountPath: /data
              readOnly: true
            - name: auth
              mountPath: /run/auth
              readOnly: true
      volumes:
        - name: documents
          persistentVolumeClaim:
            claimName: documents
        - name: auth
          secret:
            secretName: portal-auth
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: fc-accountant
spec:
  selector:
    app: fc-accountant
  ports:
    - name: http
      port: 8080
      targetPort: http
