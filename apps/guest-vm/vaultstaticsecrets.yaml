apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: guest-vm-vpn
  namespace: guest-vm
spec:
  vaultAuthRef: vault/default
  mount: secret
  type: kv-v2
  path: guest-vm/config
  refreshAfter: 1m
  rolloutRestartTargets:
    - kind: Deployment
      name: guest-vm-gateway
  destination:
    name: guest-vm-vpn
    create: true
    labels:
      app.kubernetes.io/name: guest-vm-gateway
    transformation:
      excludeRaw: true
      templates:
        VPN_SERVICE_PROVIDER:
          text: '{{ .Secrets.vpn_service_provider }}'
        WIREGUARD_PRIVATE_KEY:
          text: '{{ .Secrets.vpn_private_key }}'
        WIREGUARD_PRESHARED_KEY:
          text: '{{ .Secrets.vpn_preshared_key }}'
        WIREGUARD_ADDRESSES:
          text: '{{ .Secrets.vpn_tunnel_address }}'
        FIREWALL_VPN_INPUT_PORTS:
          text: '{{ .Secrets.vpn_forwarded_port }}'
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: guest-vm-wireguard
  namespace: guest-vm
spec:
  vaultAuthRef: vault/default
  mount: secret
  type: kv-v2
  path: guest-vm/config
  refreshAfter: 1m
  rolloutRestartTargets:
    - kind: Deployment
      name: guest-vm-gateway
  destination:
    name: guest-vm-wireguard
    create: true
    labels:
      app.kubernetes.io/name: guest-vm-gateway
    transformation:
      excludeRaw: true
      templates:
        wg0.conf:
          text: |
            [Interface]
            Address = 10.203.77.1/32
            ListenPort = {{ .Secrets.vpn_forwarded_port }}
            PrivateKey = {{ .Secrets.wg_server_private_key }}
            PostUp = ip rule del priority 97 to 10.203.77.0/24 lookup main 2>/dev/null || true; ip rule add priority 97 to 10.203.77.0/24 lookup main
            PostDown = ip rule del priority 97 to 10.203.77.0/24 lookup main 2>/dev/null || true

            [Peer]
            PublicKey = {{ .Secrets.guest_wg_public_key }}
            AllowedIPs = 10.203.77.2/32
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: guest-vm-cloud-init
  namespace: guest-vm
spec:
  vaultAuthRef: vault/default
  mount: secret
  type: kv-v2
  path: guest-vm/config
  refreshAfter: 1m
  destination:
    name: guest-vm-cloud-init
    create: true
    labels:
      app.kubernetes.io/name: guest-vm
    transformation:
      excludeRaw: true
      templates:
        userdata:
          text: |-
            #cloud-config
            hostname: guest-vm
            manage_etc_hosts: true
            package_update: true
            package_upgrade: false
            ssh_pwauth: false
            disable_root: true
            users:
              - name: guest
                gecos: Guest administrator
                groups:
                  - adm
                  - sudo
                sudo:
                  - ALL=(ALL) NOPASSWD:ALL
                shell: /bin/bash
                lock_passwd: true
                ssh_authorized_keys:
                  - >-
                    {{ .Secrets.guest_ssh_public_key }}
              - name: stian
                gecos: Owner recovery administrator
                groups:
                  - adm
                  - sudo
                sudo:
                  - ALL=(ALL) NOPASSWD:ALL
                shell: /bin/bash
                lock_passwd: true
                ssh_authorized_keys:
                  - >-
                    ssh-rsa 
            packages:
              - openssh-server
              - qemu-guest-agent
              - unattended-upgrades
            write_files:
              - path: /etc/ssh/sshd_config.d/99-guest-vm.conf
                owner: root:root
                permissions: "0644"
                content: |
                  PasswordAuthentication no
                  KbdInteractiveAuthentication no
                  PermitRootLogin no
                  PubkeyAuthentication yes
              - path: /etc/apt/apt.conf.d/20auto-upgrades
                owner: root:root
                permissions: "0644"
                content: |
                  APT::Periodic::Update-Package-Lists "1";
                  APT::Periodic::Unattended-Upgrade "1";
            runcmd:
              - systemctl enable --now qemu-guest-agent
              - systemctl enable --now unattended-upgrades
              - systemctl enable --now ssh
              - systemctl restart ssh
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: guest-vm-guest-ssh
  namespace: guest-vm
spec:
  vaultAuthRef: vault/default
  mount: secret
  type: kv-v2
  path: guest-vm/config
  refreshAfter: 1m
  destination:
    name: guest-vm-guest-ssh
    create: true
    labels:
      app.kubernetes.io/name: guest-vm
    transformation:
      excludeRaw: true
      templates:
        key:
          text: '{{ .Secrets.guest_ssh_public_key }}'
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: guest-vm-connection
  namespace: guest-vm
spec:
  vaultAuthRef: vault/default
  mount: secret
  type: kv-v2
  path: guest-vm/config
  refreshAfter: 1m
  destination:
    name: guest-vm-connection
    create: true
    labels:
      app.kubernetes.io/name: guest-vm-gateway
    transformation:
      excludeRaw: true
      templates:
        endpoint:
          text: '{{ .Secrets.vpn_ddns_name }}'
        forwarded_port:
          text: '{{ .Secrets.vpn_forwarded_port }}'
        server_public_key:
          text: '{{ .Secrets.wg_server_public_key }}'
