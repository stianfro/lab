apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: bootstrap-config
          image: ghcr.io/home-assistant/home-assistant:2026.8.1@sha256:6340a3de3917a9b19368e767310a96dd090f6a19aca8aeadf87fd1145cec9682
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              cfg=/config/configuration.yaml
              if [ ! -f "$cfg" ]; then
                cat > "$cfg" <<'EOF'
              default_config:

              homeassistant:
                packages: !include_dir_named packages

              http:
                use_x_forwarded_for: true
                trusted_proxies:
                  - 10.244.0.0/16
              EOF
                echo "created $cfg"
              else
                if ! grep -q '^default_config:' "$cfg"; then
                  printf '\ndefault_config:\n' >> "$cfg"
                fi
                if ! grep -q 'packages: !include_dir_named packages' "$cfg"; then
                  printf '\nhomeassistant:\n  packages: !include_dir_named packages\n' >> "$cfg"
                fi
                if ! grep -q '^http:' "$cfg"; then
                  printf '\nhttp:\n  use_x_forwarded_for: true\n  trusted_proxies:\n    - 10.244.0.0/16\n' >> "$cfg"
                fi
                echo "checked $cfg"
              fi
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.8.1@sha256:6340a3de3917a9b19368e767310a96dd090f6a19aca8aeadf87fd1145cec9682
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: packages
              mountPath: /config/packages
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: packages
          configMap:
            name: ha-packages
