apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: static-web
  namespace: isometric-tokyo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: isometric-tokyo
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: 8080
  egress: []
