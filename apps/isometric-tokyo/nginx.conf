worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 1k;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    map $uri $cache_control {
        default "no-cache";
        ~^/assets/ "public, max-age=31536000, immutable";
        ~*\.(?:png|webp|jpe?g)$ "public, max-age=3600, must-revalidate";
        /healthz "no-store";
    }
    map $status $response_cache_control {
        default "no-store";
        200 $cache_control;
        206 $cache_control;
        304 $cache_control;
    }
    server {
        listen 8080;
        root /srv/site;
        index index.html;
        add_header Cache-Control $response_cache_control always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; worker-src 'self' blob:; object-src 'none'; form-action 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }
        location / {
            limit_except GET HEAD { deny all; }
            try_files $uri $uri/ =404;
        }
        location ~ /\. { deny all; }
    }
}
