apiVersion: v1
kind: ServiceAccount
metadata:
  name: intermittent-icmp
  namespace: kemuri
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: intermittent-icmp-state
  namespace: kemuri
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    resourceNames:
      - intermittent-icmp-0
    verbs:
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: intermittent-icmp-state
  namespace: kemuri
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: intermittent-icmp-state
subjects:
  - kind: ServiceAccount
    name: intermittent-icmp
    namespace: kemuri
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: intermittent-icmp-blocked
  namespace: kemuri
spec:
  podSelector:
    matchLabels:
      kemuri.io/icmp-state: blocked
  policyTypes:
    - Ingress
  ingress: []
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: intermittent-icmp
  namespace: kemuri
  labels:
    app.kubernetes.io/name: intermittent-icmp
spec:
  replicas: 1
  serviceName: intermittent-icmp
  selector:
    matchLabels:
      app.kubernetes.io/name: intermittent-icmp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intermittent-icmp
        kemuri.io/icmp-state: reachable
    spec:
      serviceAccountName: intermittent-icmp
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fixture
          image: busybox:1.37.0@sha256:1487d0af5f52b4ba31c7e465126ee2123fe3f2305d638e7827681e7cf6c83d5e
          command:
            - sleep
            - "2147483647"
          resources:
            requests:
              cpu: 1m
              memory: 2Mi
            limits:
              cpu: 20m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: state-controller
          image: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
          command:
            - /bin/sh
            - -ec
            - |
              api="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}"
              token_file=/var/run/secrets/kubernetes.io/serviceaccount/token
              ca_file=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              pod_url="${api}/api/v1/namespaces/kemuri/pods/intermittent-icmp-0"

              set_state() {
                curl --fail --silent --show-error --retry 5 \
                  --cacert "${ca_file}" \
                  -H "Authorization: Bearer $(cat "${token_file}")" \
                  -H "Content-Type: application/merge-patch+json" \
                  -X PATCH \
                  --data "{\"metadata\":{\"labels\":{\"kemuri.io/icmp-state\":\"${1}\"}}}" \
                  "${pod_url}" >/dev/null
              }

              trap 'set_state reachable' EXIT
              while true; do
                set_state reachable
                sleep 240
                set_state blocked
                sleep 120
              done
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 20m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: intermittent-icmp
  namespace: kemuri
  labels:
    app.kubernetes.io/name: intermittent-icmp
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: intermittent-icmp
