apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: mosquitto
  labels:
    app.kubernetes.io/name: mosquitto
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mosquitto
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mosquitto
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883
        runAsGroup: 1883
        fsGroup: 1883
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: auth-init
          image: eclipse-mosquitto:2.0.22@sha256:212f89e1eaeb2c322d6441b64396e3346026674db8fa9c27beac293405c32b3c
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              mosquitto_passwd -c -b /mosquitto/auth/passwd homeassistant "$HOMEASSISTANT_PASSWORD"
              mosquitto_passwd -b /mosquitto/auth/passwd pizero "$PIZERO_PASSWORD"
              mosquitto_passwd -b /mosquitto/auth/passwd exporter "$EXPORTER_PASSWORD"
              cp /mosquitto/acl-src/acl /mosquitto/auth/acl
              chmod 0600 /mosquitto/auth/passwd /mosquitto/auth/acl
          env:
            - name: HOMEASSISTANT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mosquitto-credentials
                  key: homeassistant_password
            - name: PIZERO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mosquitto-credentials
                  key: pizero_password
            - name: EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mosquitto-credentials
                  key: exporter_password
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: auth
              mountPath: /mosquitto/auth
            - name: acl
              mountPath: /mosquitto/acl-src
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0.22@sha256:212f89e1eaeb2c322d6441b64396e3346026674db8fa9c27beac293405c32b3c
          imagePullPolicy: IfNotPresent
          ports:
            - name: mqtt
              containerPort: 1883
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
              readOnly: true
            - name: auth
              mountPath: /mosquitto/auth
              readOnly: true
            - name: data
              mountPath: /mosquitto/data
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
        - name: acl
          configMap:
            name: mosquitto-acl
        - name: auth
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 1Mi
        - name: data
          persistentVolumeClaim:
            claimName: mosquitto-data
