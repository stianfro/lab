apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - vaultstaticsecret.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - exporter.yaml

configMapGenerator:
  - name: mosquitto-grafana-dashboards
    namespace: mosquitto
    files:
      - dashboards/mosquitto-broker.json
    options:
      labels:
        grafana_dashboard: "1"

generatorOptions:
  disableNameSuffixHash: true
