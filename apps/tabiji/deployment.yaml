apiVersion: apps/v1
kind: Deployment
metadata:
  name: tabiji
  namespace: tabiji
  labels:
    app.kubernetes.io/name: tabiji
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tabiji
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tabiji
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/stianfro/tabiji:sha-72c8c42@sha256:f2e504d2eeedcaa04e012a46957eef562e6b435c6c498766f236bd1355a8ad35
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
