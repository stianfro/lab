# Proxy-DHCP PXE server.
# Answers only the PXE part of DHCP; the router keeps handing out
# addresses, so nothing on the router changes.

# Disable the DNS server part of dnsmasq.
port=0
log-dhcp

# Proxy mode for the LAN subnet.
dhcp-range=192.168.1.0,proxy

enable-tftp
tftp-root=/tftpboot

# iPXE identifies itself with DHCP option 175.
dhcp-match=set:ipxe,175

# Stage 1: firmware PXE stack chainloads iPXE over TFTP.
# snponly.efi drives the NIC through the firmware driver, which is the
# safest choice for consumer 2.5GbE NICs.
pxe-service=tag:!ipxe,x86PC,"Chainload iPXE",undionly.kpxe
pxe-service=tag:!ipxe,BC_EFI,"Chainload iPXE",snponly.efi
pxe-service=tag:!ipxe,x86-64_EFI,"Chainload iPXE",snponly.efi

# Stage 2: iPXE fetches the boot script over HTTP.
pxe-service=tag:ipxe,x86PC,"Boot script",http://192.168.1.10:8181/boot.ipxe
pxe-service=tag:ipxe,BC_EFI,"Boot script",http://192.168.1.10:8181/boot.ipxe
pxe-service=tag:ipxe,x86-64_EFI,"Boot script",http://192.168.1.10:8181/boot.ipxe

# Auto-select the first entry immediately; no keyboard needed.
pxe-prompt="netboot",0
