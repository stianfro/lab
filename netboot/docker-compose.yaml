services:
  # One-shot: downloads iPXE binaries and the Talos PXE assets for the
  # pinned schematic, then generates the Talos install script with local
  # asset URLs. Idempotent; re-runs are fast.
  assets:
    image: alpine:3.22
    command: sh /init/netboot-init.sh
    volumes:
      - ./init:/init:ro
      - ./tftpboot:/tftpboot
      - ./http:/http
    restart: "no"

  # Proxy-DHCP + TFTP. Answers only the PXE part of the DHCP conversation;
  # the router keeps assigning addresses. Needs host networking to see
  # DHCP broadcasts.
  dnsmasq:
    image: alpine:3.22
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
      - NET_BROADCAST
    command:
      - sh
      - -c
      - apk add --no-cache dnsmasq && exec dnsmasq --keep-in-foreground --conf-file=/etc/dnsmasq-pxe.conf --log-facility=-
    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq-pxe.conf:ro
      - ./tftpboot:/tftpboot:ro
    depends_on:
      assets:
        condition: service_completed_successfully
    restart: unless-stopped

  # Serves boot.ipxe, per-node scripts, and the Talos kernel/initramfs.
  http:
    image: nginx:1.27-alpine
    ports:
      - "8181:80"
    volumes:
      - ./http:/usr/share/nginx/html:ro
    depends_on:
      assets:
        condition: service_completed_successfully
    restart: unless-stopped
