- op: add
  path: /cluster/controlPlane/endpoint
  value: https://talos.froystein.jp:6443

- op: add
  path: /cluster/etcd/extraArgs
  value:
    listen-metrics-urls: http://0.0.0.0:2381

# Use "add" instead of "replace" below: these paths do not exist in a
# fresh machine config, and RFC 6902 replace fails on missing paths.
# add creates the member and also overwrites it when it already exists.
- op: add
  path: /machine/kubelet/extraMounts
  value:
    - destination: /var/lib/longhorn
      type: bind
      source: /var/lib/longhorn
      options:
        - bind
        - rshared
        - rw

- op: add
  path: /machine/sysctls
  value:
    vm.nr_hugepages: "1024"

- op: add
  path: /machine/kernel
  value:
    modules:
      - name: nvme_tcp
      - name: vfio_pci
